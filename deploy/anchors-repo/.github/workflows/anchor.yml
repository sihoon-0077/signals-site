# 매일 18시(KST) 무렵: 사이트에 일일 앵커를 만들게 하고 → 공개키·과거 앵커를 대조해 받아 두고 →
# 사이트와 따로 만든 Python 검증기로 확인한 뒤 → 비트코인(OpenTimestamps)에 고정을 요청하고 → 이 저장소에 커밋한다.
# 어느 단계든 실패하면 커밋하지 않는다. 비트코인 고정 단계만 예외다: 실패하거나 5분 안에 끝나지 않아도 앵커는 커밋하고,
# 증명은 다음 실행 때 다시 요청·갱신한다. 그 대신 커밋 뒤의 증명 점검(proofs job)이 이틀이 지나도 완성되지 않은 증명을 찾으면
# 실행을 실패로 표시해 알린다(그 실행의 커밋은 이미 끝난 것). 실패한 실행은 Actions 탭에 공개로 보인다(GitHub 보관 기간: 공개 저장소 최대 90일, 관리자가 지울 수 있음).
# 앵커는 그날(KST 24시 전)에만 만들 수 있고 빠진 날은 나중에 채우지 않는다. 예약 실행은 늦어지거나 빠질 수 있어 같은 날 한 번 더 돈다.
# 비밀값과 쓰기 토큰은 job 단위로 나눠 준다. 같은 job 안에서 돈 코드는 그 job의 비밀값·토큰을 러너 메모리에서 꺼내거나
# git hook·.git/config·GITHUB_ENV·GITHUB_PATH·sudo로 뒤 단계에 끼어들 수 있어, 단계 순서나 단계마다 따로 주는 것으로는 막지 못한다.
# job은 저마다 새 가상 머신에서 돌고 토큰도 job마다 따로 발급된다.
#   request: CRON_SECRET으로 앵커 생성만 요청한다. GitHub의 checkout 액션과 러너 기본 bash·curl·jq만 돈다.
#   check:   비밀값 없이 공개키·과거 앵커를 대조해 받는다. PyPI 패키지(검증기·ots)는 이 job에서만 돈다.
#   publish: 쓰기 권한은 이 job에만 준다. check job이 넘긴 파일 가운데 앵커 .json과 keys.json은 사이트의 같은 문서와 다시 대조하고,
#            .ots는 파일 머리·문서 지문과 한 방향 규칙(대기 중→완성본)만 확인한 뒤(scripts/accept-files.sh, Python·PyPI 없이) 커밋한다.
#   proofs:  커밋 뒤 비트코인 증명 점검(scripts/proof-age.sh, bash만, 읽기 권한).
# 설정: Settings → Secrets and variables → Actions → Variables: SITE_URL (Vercel Settings → Domains의 운영 도메인, 예: https://signals.example.com)
#       Settings → Environments → anchor-cron → Environment secrets: CRON_SECRET (사이트 환경변수 CRON_SECRET과 같은 값)
#       environment 비밀값은 그 environment를 쓰는 job(request)에만 주어진다(GitHub 문서). Repository secrets에는 넣지 않는다.
name: daily-anchor

on:
  schedule:
    - cron: "17 9 * * *" # UTC 09:17 = KST 18:17. 매시 정각은 GitHub 부하 시간대라 피한다(늦어지거나 빠지기 쉬움).
    - cron: "47 11 * * *" # UTC 11:47 = KST 20:47. 같은 날 재시도(이미 만들어진 날은 새로 만들지 않고 대조·미러링만 한다).
  workflow_dispatch: {}

# 기본은 읽기 전용이다. 쓰기 권한은 아래 publish job에서만 받는다.
permissions:
  contents: read

concurrency:
  group: daily-anchor
  cancel-in-progress: false

jobs:
  request:
    # 앵커는 그날에만 만들 수 있으므로 가장 먼저 요청한다. 이 job에서는 PyPI 코드가 돌지 않는다.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # CRON_SECRET은 이 environment의 비밀값이다. deployment: false라 실행마다 배포 기록(Deployments)을 만들지 않는다.
    environment:
      name: anchor-cron
      deployment: false
    steps:
      # 액션은 태그 대신 커밋 SHA로 고정한다(태그 바꿔치기에 휘둘리지 않게). 모두 Node 24 런타임.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # bash·curl·jq는 러너 기본 설치
      - name: 사이트에 오늘 앵커 만들기 요청
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/request-anchor.sh

  check:
    needs: request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 이벤트 당시 커밋이 아니라 지금 브랜치의 최신 커밋을 받는다.
          # 없으면 대기했던 실행·Re-run이 앞 실행의 커밋을 못 보고 같은 날짜를 다시 커밋하다 push가 거부된다.
          ref: ${{ github.ref }}
          # 이 job의 토큰은 읽기 전용이지만 .git/config에 남길 이유가 없다.
          persist-credentials: false

      # 공개 주소만 읽는다(bash·curl·jq). Python·PyPI 설치보다 먼저 돈다.
      - name: 공개키·과거 앵커 대조 + 새 앵커 받기
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash scripts/pull-anchor.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # run을 블록(|)으로 쓴다: 한 줄로 쓰면 ':all: '의 콜론+공백을 YAML이 키 구분자로 읽어 워크플로 파일 전체가 무효가 된다.
      - name: 도구 설치(버전·해시 고정, wheel만)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r requirements.txt

      - name: 별도 구현 검증기로 확인(머클 루트 재계산·서명·prev_root 사슬)
        run: python scripts/verify_anchor.py

      # 캘린더 장애로 실패하거나 멈춰도 앵커 커밋은 막지 않는다. 스크립트가 호출마다 60초, 새 호출은 150초까지로 스스로 끊고,
      # 이 단계 상한(5분)은 그래도 끝나지 않을 때를 위한 것이다. 오래 이어지는 실패는 커밋 뒤 proofs job이 알린다.
      - name: 비트코인 고정 요청·대기 중 증명 갱신
        timeout-minutes: 5
        continue-on-error: true
        run: bash scripts/ots-stamp.sh

      # 커밋할 파일만 publish job에 넘긴다(.bak 같은 다른 파일은 넘기지 않음). 모두 이 공개 저장소에 올라갈 공개 자료다.
      - name: 커밋할 파일 넘기기
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anchor-files
          path: |
            keys.json
            anchors/*.json
            anchors/*.json.ots
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          # 쓰기 토큰을 .git/config에 남기지 않는다. 토큰은 마지막 커밋 단계의 환경변수로만 준다.
          persist-credentials: false

      # 작업 폴더 밖에 받는다. 받은 파일은 실행하지 않고, 다음 단계가 이름·내용을 확인한 것만 옮긴다.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anchor-files
          path: ${{ runner.temp }}/anchor-files

      - name: 넘겨받은 파일 확인(사이트 문서와 다시 대조)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash scripts/accept-files.sh "$RUNNER_TEMP/anchor-files"

      - name: 커밋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anchors keys.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git commit -m "anchor $(TZ=Asia/Seoul date +%F)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 이 실행 중에 다른 커밋이 올라왔으면 그 위로 옮겨 올린다. 강제 push는 하지 않는다(기록을 덮어쓰지 않게).
          git fetch --no-tags "$remote" "$GITHUB_REF"
          if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::실행 중에 같은 파일을 고친 커밋이 올라와 자동 커밋을 올리지 못했습니다. Actions에서 Run workflow로 다시 실행하세요."
              exit 1
            fi
          fi
          git push "$remote" "HEAD:${GITHUB_REF}"

  proofs:
    # 커밋 뒤 비트코인 증명 점검. 비트코인 고정 단계는 커밋을 막지 않으므로(continue-on-error) 캘린더 장애가 이어지거나
    # 증명이 깨져도 실행은 초록색으로 끝난다. 이 job은 이틀이 지나도 완성되지 않은 증명이 있으면 실패해 실패 알림을 보낸다(앵커는 이미 커밋됨).
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish job이 방금 올린 커밋까지 받는다.
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: 비트코인 증명 점검(커밋 뒤)
        run: bash scripts/proof-age.sh
